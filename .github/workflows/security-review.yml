name: Security Review Agent

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "config/**"
      - "**/entrypoint.sh"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".env.example"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: mitrity-io/iag-public-ci/.github/workflows/demo-security-review.yml@main
    secrets: inherit
